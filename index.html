<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="지도 노트">
<meta name="theme-color" content="#edf0ea">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>지도 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 공책처럼 비어 있는 전체 화면 캔버스. 위에 상태바, 아래에 펜 설정 + 도구 4개. */
:root {
  --font-ui: "IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --paper: #edf0ea;
  --surface: #f8f9f5;
  --ink: #1d262d;
  --ink-2: #5a6670;
  --line: #cdd4cc;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(217, 72, 15, 0.12);
  --danger: #c92a2a;
  --grid-minor: rgba(60, 90, 80, 0.10);
  --grid-major: rgba(60, 90, 80, 0.22);

  --c-cyan: #0891b2;
  --c-orange: #e8590c;
  --c-green: #2f9e44;
  --c-red: #e03131;

  --p-city: #2b64c4;
  --p-corp: #9c2f86;
  --p-bldg: #0e8a7a;
  --p-metro: #2f9e44;
  --p-bus: #e8590c;
  --p-rail: #495057;
  --p-sign: #1971c2; --p-sign-hw: #2b8a3e; --p-sign-loc: #e8590c; --p-peak: #8a5a2b;
  --c-water: #4dabf7; --road-major: #ee8a2c; --road-fill: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14181b; --surface: #22282d; --ink: #e6eae8; --ink-2: #9aa6ae; --line: #38424a;
    --accent: #ff8a3d; --accent-ink: #1b1206; --accent-soft: rgba(255, 138, 61, 0.16);
    --danger: #ff7a7a;
    --grid-minor: rgba(200, 220, 215, 0.06); --grid-major: rgba(200, 220, 215, 0.13);
    --c-cyan: #22d3ee; --c-orange: #ff8a3d; --c-green: #69db7c; --c-red: #ff6b6b;
    --p-city: #7fb0ff; --p-corp: #e58ad3; --p-bldg: #4fd1bd;
    --p-metro: #69db7c; --p-bus: #ff922b; --p-rail: #ced4da; --p-sign: #74c0fc; --p-sign-hw: #69db7c; --p-sign-loc: #ffa94d; --p-peak: #d4a373; --c-water: #3b8fd9; --road-major: #ffa94d; --road-fill: #3a4048;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14181b; --surface: #22282d; --ink: #e6eae8; --ink-2: #9aa6ae; --line: #38424a;
  --accent: #ff8a3d; --accent-ink: #1b1206; --accent-soft: rgba(255, 138, 61, 0.16);
  --danger: #ff7a7a;
  --grid-minor: rgba(200, 220, 215, 0.06); --grid-major: rgba(200, 220, 215, 0.13);
  --c-cyan: #22d3ee; --c-orange: #ff8a3d; --c-green: #69db7c; --c-red: #ff6b6b;
  --p-city: #7fb0ff; --p-corp: #e58ad3; --p-bldg: #4fd1bd;
  --p-metro: #69db7c; --p-bus: #ff922b; --p-rail: #ced4da; --p-sign: #74c0fc; --p-sign-hw: #69db7c; --p-sign-loc: #ffa94d; --p-peak: #d4a373; --c-water: #3b8fd9; --road-major: #ffa94d; --road-fill: #3a4048;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.4 var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* 상단 바 */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { min-width: 0; display: flex; flex-direction: column; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.status { font: 400 11px/1.3 var(--font-mono); color: var(--ink-2); }
.status[data-k="err"] { color: var(--danger); }
.acts { display: flex; gap: 2px; }
.ib {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink);
}
.ib:disabled { color: var(--ink-2); opacity: 0.4; cursor: default; }
.ib:not(:disabled):active { background: var(--accent-soft); }
.ib[aria-pressed="true"], .ib[data-on="1"] { background: var(--accent-soft); color: var(--accent); }
.ib svg, .mode svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 캔버스 */
.stage { position: relative; flex: 1; min-height: 0; background: var(--paper); }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.tip, .empty, .demo, .zoom, .load { position: absolute; }
.tip {
  top: 56px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 7px 14px; border-radius: 999px;
  background: var(--ink); color: var(--paper); font-size: 13px; text-align: center;
  pointer-events: none;
}
.empty {
  left: 50%; top: 42%; transform: translate(-50%, -50%);
  width: min(300px, calc(100% - 32px)); text-align: center; pointer-events: none;
}
.empty b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.empty p { margin: 0; color: var(--ink-2); font-size: 13px; }
.demo {
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: 10px;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 4px 4px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2);
}
.demo button {
  min-height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 500;
}
.demo button[data-armed="1"] { border-color: var(--danger); color: var(--danger); }
.zoom {
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px;
  font: 500 11px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; pointer-events: none;
}
.load { inset: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink-2); font-size: 13px; }

/* 하단 도구 */
.dock {
  background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px;
}
.opts { display: flex; gap: 8px; overflow-x: auto; min-height: 44px; align-items: center; scrollbar-width: none; }
.opts::-webkit-scrollbar { display: none; }
.opts:empty { display: none; }
.opts.wrap { flex-wrap: wrap; overflow: visible; }
.optsbox { display: flex; flex-direction: column; gap: 4px; }
.optsbox:empty { display: none; }
.row { display: flex; gap: 6px; overflow-x: auto; align-items: center; min-height: 40px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.ps svg { width: 28px; height: 14px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; }
.ps svg circle { fill: currentColor; stroke: none; }
.chip {
  flex: none; min-height: 40px; min-width: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 20px; border: 1px solid var(--line); background: transparent; font-size: 14px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip.round { padding: 0; border-radius: 50%; width: 38px; min-width: 38px; min-height: 38px; }
.chip.danger { color: var(--danger); border-color: var(--danger); }
.vr { flex: none; width: 1px; height: 24px; background: var(--line); }
.sw { width: 14px; height: 14px; background: var(--c); display: inline-block; }
.sw.dot { width: 20px; height: 20px; border-radius: 50%; }
.sw.city { border-radius: 50%; }
.sw.corp { border-radius: 3px; }
.sw.bldg { transform: rotate(45deg) scale(0.8); border-radius: 2px; }
.sw.metro { border-radius: 50%; }
.sw.bus { border-radius: 4px; }
.sw.rail { border-radius: 2px; }
.sw.sign { border-radius: 40% 40% 50% 50%; }
.sw.peak { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.meas { flex: none; padding: 0 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.numin { flex: none; width: 84px; min-height: 38px; padding: 0 8px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: center; }
.wl { display: block; width: 26px; border-radius: 2px; background: var(--ink); }
.modes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.mode {
  min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 500;
}
.mode[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* 편집 시트 */
.sheet {
  position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 20; max-height: min(82%, calc(var(--vvh, 100vh) - 12px)); overflow-y: auto;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18);
  padding-top: 14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.sh-head { display: flex; align-items: center; justify-content: space-between; }
.sh-head strong { font-size: 16px; font-weight: 600; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.lab { font: 500 12px var(--font-mono); letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; }
.sheet input[type="text"], .sheet input[type="number"], .sheet textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); resize: vertical;
}
.sh-foot { display: flex; justify-content: flex-start; }

/* 넓은 화면(아이패드·가로 모드): 위쪽 가운데에 좁게 띄워서 키보드에 안 가리게 */
@media (min-width: 700px) {
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 56px; width: min(540px, calc(100% - 32px));
    transform: translateX(-50%); max-height: calc(100% - 72px);
    border: 1px solid var(--line); border-radius: 16px; padding-bottom: 14px;
  }
}

/* 보이는 것 선택 */
.layers {
  position: absolute; top: 8px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
  display: flex; flex-direction: column; gap: 2px; padding: 8px; width: min(290px, calc(100% - 32px));
  max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.layers h2 { margin: 2px 8px 4px; font: 500 12px var(--font-mono); letter-spacing: 0.06em; color: var(--ink-2); }
.lrow { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; font-size: 14px; text-align: left; }
.lrow:active { background: var(--accent-soft); }
.lrow[aria-pressed="false"] { color: var(--ink-2); }
.ck { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 5px; }
.lrow[aria-pressed="true"] .ck { background: var(--accent); border-color: var(--accent); }
.lrow[aria-pressed="true"] .ck::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translate(1px, -1px); }

/* 시대 선택 */
.erabtn { position: absolute; top: 8px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 4; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; max-width: calc(100% - 120px); padding: 0 12px 0 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
.erabtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erabtn small { flex: none; font: 500 11px var(--font-mono); color: var(--accent); }
.erabtn svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.erapanel { position: absolute; top: 56px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 6; width: min(330px, calc(100% - 32px)); max-height: calc(100% - 68px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); }
.erapanel h2 { margin: 6px 4px 0; font: 500 12px var(--font-mono); letter-spacing: 0.06em; color: var(--ink-2); }
.erapanel h2:first-child { margin-top: 2px; }
.era { display: flex; gap: 6px; }
.era .pick { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.era .pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.era .eye { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink-2); }
.era .eye[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.era .eye:disabled { opacity: 0.3; cursor: default; }
.era .eye svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.erapanel input[type="text"] { width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.erapanel .btn.soft { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.hint { margin: 0 4px; font-size: 12px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px 4px; }
.layers .chip { min-height: 36px; padding: 0 12px; font-size: 13px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.login { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: var(--paper); }
.login > div { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; }
.login h1 { margin: 0; font-size: 26px; }
.login p { margin: 0; color: var(--ink-2); }
.login .err { color: var(--danger); font-size: 13px; text-align: left; }
.login button { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
.login button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div id="login" class="login" hidden><div><h1>지도 노트</h1><p>구글 계정으로 로그인하면 폰과 아이패드에서 같은 지도를 볼 수 있어요.</p><button id="loginBtn" type="button">Google로 로그인</button><div id="loginErr" class="err" role="alert"></div></div></div>


<div class="app">
  <header class="top">
    <div class="brand">
      <h1>지도 노트</h1>
      <span id="status" class="status" role="status">불러오는 중…</span>
    </div>
    <div class="acts">
      <button id="layerBtn" class="ib" aria-label="보이는 것 선택" aria-expanded="false" data-on="0"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></svg></button>
      <button id="gridBtn" class="ib" aria-label="격자 보기" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></button>
      <button id="undo" class="ib" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="redo" class="ib" aria-label="다시 하기" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button id="fit" class="ib" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <main id="stage" class="stage">
    <canvas id="cv" aria-label="지도 그리기 화면"></canvas>
    <div id="tip" class="tip" role="status" hidden></div>
    <div id="empty" class="empty" hidden>
      <b>빈 노트예요</b>
      <p>아래에서 펜을 고르고 화면에 그려 보세요. 두 손가락으로 확대하고 움직일 수 있어요.</p>
    </div>
    <div id="demo" class="demo" hidden><span>예시 지도예요</span><button id="clearDemo" type="button">예시 지우기</button></div>
    <div id="zoom" class="zoom">100%</div>
    <button id="eraBtn" class="erabtn" type="button" aria-expanded="false" aria-label="시대 선택"><span id="eraName">현재</span><small id="eraGhost" hidden></small><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div id="eras" class="erapanel" role="group" aria-label="시대" hidden></div>
    <div id="layers" class="layers" role="group" aria-label="보이는 것" hidden></div>
    <div id="load" class="load">지도를 불러오는 중</div>
  </main>

  <footer class="dock">
    <div id="opts" class="optsbox" role="group" aria-label="도구 설정"></div>
    <nav class="modes" aria-label="그리기 도구">
      <button class="mode" data-mode="pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg>펜</button>
      <button class="mode" data-mode="select" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 3l12 7.5-5.2 1.6L10.5 18z"/></svg>선택</button>
      <button class="mode" data-mode="pin" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>핀</button>
      <button class="mode" data-mode="text" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg>글자</button>
      <button class="mode" data-mode="ruler" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10.5 8v4.5M14.5 8v3M18.5 8v4.5"/></svg>재기</button>
      <button class="mode" data-mode="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M16.2 3.8l4 4a2 2 0 0 1 0 2.8L11 19.8H7l-3.2-3.2a2 2 0 0 1 0-2.8l9.6-10a2 2 0 0 1 2.8 0z"/><path d="M9 8.2l6.8 6.8M11 19.8h9"/></svg>지우개</button>
    </nav>
  </footer>
</div>

<section id="sheet" class="sheet" role="dialog" aria-label="항목 편집" hidden>
  <div class="sh-head"><strong id="sh-title">핀 편집</strong><button id="sh-close" class="btn" type="button">완료</button></div>
  <label class="lab" id="l-name" for="f-name">이름</label>

        if (d <= bd) { bd = d; bv = [px, py]; }
      });
      if (bv) pts[ei] = bv;
    }
    fixEnd(0, 1); fixEnd(n - 1, n - 2);
    return pts.map(function (q) { return [r1(q[0]), r1(q[1])]; });
  }

  function snapPt(w, z) {
    var T = 12 / z, best = null, bd = T;
    buckets().pens.forEach(function (f) {
      for (var i = 0; i < f.p.length; i += 2) { var d = Math.hypot(f.p[i] - w[0], f.p[i + 1] - w[1]); if (d <= bd) { bd = d; best = [f.p[i], f.p[i + 1]]; } }
    });
    return best;
  }
  function finishStroke(s, p) {
    var z = view.z, tapped = !s.panning && s.moved < 8 && (performance.now() - s.t) < 700;
    if (s.m === 'pan') { requestDraw(); return; }
    if (s.m === 'ul') { ulPut(s.u); requestDraw(); return; }
    if (s.m === 'ruler') { if (s.moved < 6) state.ruler = null; requestDraw(); return; }
    if (s.m === 'select') {
      if (s.drag) {
        if (s.dragging) {
          var moved = features.get(s.drag.id);
          if (moved) commit([{ id: s.drag.id, before: s.drag.orig, after: moved }]);
        }
        renderOptions(); requestDraw(); return;
      }
      if (tapped) { selIds = new Set(); renderOptions(); }
      requestDraw(); return;
    }
    if (s.m === 'pin') {
      if (!tapped) { requestDraw(); return; }
      var w = toWorld(p), h2 = hitPin(w, 14);
      if (h2) { openSheet(h2.id, false); return; }
      var f = { id: newId(), t: 'pin', k: state.pinKind, p: [r1(w[0]), r1(w[1])], n: '', m: '', era: state.era, ts: Date.now() };
      if (f.k === 'metro' && state.lineColor) f.lc = state.lineColor;
      if (f.k === 'sign') f.sg = state.signKind;
      reveal(f); commit([{ id: f.id, before: null, after: f }]); openSheet(f.id, true); return;
    }
    if (s.m === 'text') {
      if (!tapped) { requestDraw(); return; }
      var w3 = toWorld(p), h3 = hitPin(w3, 14);
      if (h3) { openSheet(h3.id, false); return; }
      var tf = { id: newId(), t: 'text', p: [r1(w3[0]), r1(w3[1])], n: '', sz: state.textSize, era: state.era, ts: Date.now() };
      reveal(tf); features.set(tf.id, tf); invalidate(); openSheet(tf.id, true, true); return;
    }
    if (s.m === 'erase') {
      var ops = [], E2 = s.ers;
      if (E2.cutId && features.get(E2.cutId)) {
        var cf0 = features.get(E2.cutId), cpp = rdp(ptsOf(cf0), 0.7 / z);
        if (cpp.length < 2) cpp = [cpp[0], [cpp[0][0] + 0.01, cpp[0][1]]];
        var cf1 = Object.assign({}, cf0, { p: flat(cpp) }); features.set(cf1.id, cf1); E2.added.set(cf1.id, cf1);
        /* 지우개가 다 덮은 물 조각은 아예 지운다 */
        var rr = cf1.w / 2;
        Array.from(features.values()).forEach(function (wf) {
          if (wf.t !== 'pen' || wf.s !== 'water' || wf.cut || !shown(wf) || wf.w / 2 >= rr) return;
          var lim = rr - wf.w / 2, P2 = wf.p, ok = true;
          for (var a = 0; a < P2.length && ok; a += 2) {
            var dm = Infinity;
            for (var b2 = 0; b2 + 3 < cf1.p.length; b2 += 2) dm = Math.min(dm, segDist(P2[a], P2[a + 1], cf1.p[b2], cf1.p[b2 + 1], cf1.p[b2 + 2], cf1.p[b2 + 3]));
            if (dm > lim) ok = false;
          }
          if (!ok) return;
          features.delete(wf.id);
          if (E2.added.has(wf.id)) E2.added.delete(wf.id); else E2.removed.set(wf.id, wf);
        });
        invalidate();
      }
      s.ers.removed.forEach(function (f0, id) { ops.push({ id: id, before: f0, after: null }); });
      s.ers.added.forEach(function (f1, id) { ops.push({ id: id, before: null, after: f1 }); });
      s.ers = null;
      if (ops.length) commit(ops); else requestDraw();
      return;
    }
    if (s.m === 'pen') {
      var pts, ps2 = state.pen.s, mpp2 = state.cell / 50;
      if (s.rect) {
        var ra = toWorld(s.start), rb2 = toWorld(p);
        if (Math.abs(rb2[0] - ra[0]) * z < 6 || Math.abs(rb2[1] - ra[1]) * z < 6) { requestDraw(); return; }
        if (state.pen.snap) { ra = snapPt(ra, z) || ra; rb2 = snapPt(rb2, z) || rb2; }
        pts = [ra, [rb2[0], ra[1]], rb2, [ra[0], rb2[1]], [ra[0], ra[1]]];
      } else {
        pts = rdp(s.pts.map(toWorld), 0.7 / z);
        if (pts.length < 2 || polyLen(pts) < 3 / z) {
          if (ps2 === 'water' && s.pts.length) { var q0 = toWorld(s.pts[0]); pts = [q0, [q0[0] + 0.01, q0[1]]]; }
          else { requestDraw(); return; }
        }
        if (state.pen.snap && ps2 !== 'contour' && ps2 !== 'river' && ps2 !== 'terrain' && ps2 !== 'water') pts = snapStroke(pts, z);
        if (ps2 !== 'water' && pts.length >= 4 && (state.pen.snap || ps2 === 'river' || ps2 === 'contour' || ps2 === 'terrain')) {
          var f0 = pts[0], l0 = pts[pts.length - 1];
          if (Math.hypot(f0[0] - l0[0], f0[1] - l0[1]) < 16 / z && polyLen(pts) > 60 / z) pts[pts.length - 1] = [f0[0], f0[1]];
        }
      }
      var r = { id: newId(), t: 'pen', c: ps2 === 'major' ? 'orange' : (ps2 === 'road' ? state.pen.rc : state.pen.c), w: state.pen.w, s: ps2, p: flat(pts), era: state.era, ts: Date.now() };
      if (ps2 === 'contour') r.h = state.pen.h;
      if (ps2 === 'terrain') { r.h = state.pen.h; r.r = Math.max(5, r1(state.pen.rm / mpp2)); r.w = 2; }
      if (ps2 === 'river') { r.w = Math.max(2, r1(state.pen.rvm / mpp2)); r.w2 = Math.max(2, r1(state.pen.rvm2 / mpp2)); }
      if (ps2 === 'water') { r.w = Math.max(2, r1(state.pen.wb / mpp2)); if (state.pen.wcut) r.cut = 1; }
      if (ps2 === 'road') r.w = Math.max(2, r1(state.pen.rdm / mpp2));
      if (s.rect) r.sq = 1;
      reveal(r); commit([{ id: r.id, before: null, after: r }]);
    }
  }

  /* 키보드가 올라오면 편집 창이 키보드 위로 오도록 */
  (function () {
    var vv = window.visualViewport; if (!vv) return;
    var root = document.documentElement;
    function fit() {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      root.style.setProperty('--kb', Math.round(kb) + 'px');
      root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
    }
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  })();

  /* ---------- 시작 ---------- */
  new ResizeObserver(resize).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { requestDraw(); });
  updateEraBtn(); buildLayers(); renderOptions(); refreshUI(); resize(); ulLoad();
  init();
})();
</script>
</body>
